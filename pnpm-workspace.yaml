allowBuilds:
  '@swc/core': true
  lefthook: true
  sharp: true
  unrs-resolver: true
# @material-tailwind/react 2.1.10 が使う @floating-ui/react 0.19.0 は @floating-ui/dom を
# import しているのに依存として宣言していないため、pnpm の厳密な解決（Vercel のビルドなど）で
# 見つからずに失敗する。足りない依存をここで補う。
packageExtensions:
  '@floating-ui/react@0.19.0':
    dependencies:
      '@floating-ui/dom': ^1.8.0

overrides:
  baseline-browser-mapping@2: ^2.11.30
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  browserslist@4: ^4.29.4
  fast-uri@3: ^3.1.9
  fflate@0.7: ~0.7.5
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.20
  postcss@8: ^8.5.31
  postcss-selector-parser@6: ^6.1.5
  serialize-javascript@4: ^7.1.4
  source-map-js@1: ^1.2.2
